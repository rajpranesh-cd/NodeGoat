        uses: actions/checkout@v4

      - name: Get changed files (Vulnerable)
        id: changed-files
        uses: tj-actions/changed-files@v0.12.0  # Vulnerable version (pre-patch)
        with:
          dir: './'

      - name: Process changed files
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.files_changed }}"
          # Additional processing logic here
